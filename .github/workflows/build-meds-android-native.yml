name: Build My Meds Tracker Android

on:
  workflow_dispatch:
  push:
    paths:
      - 'meds-android-source.part*'
      - '.github/workflows/build-meds-android-native.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct Android source
        run: |
          cat meds-android-source.part00 meds-android-source.part01 meds-android-source.part02 meds-android-source.part03 meds-android-source.part04 meds-android-source.part05 > /tmp/source.b64
          base64 -d /tmp/source.b64 > /tmp/source.zip
          mkdir -p /tmp/meds-build
          unzip -q /tmp/source.zip -d /tmp/meds-build
          ls -la /tmp/meds-build/meds_android_project

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Use preinstalled Android SDK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Install Gradle 9.6
        run: |
          curl -L --fail -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-9.6.0-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp

      - name: Build debug APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: /tmp/gradle-9.6.0/bin/gradle -p /tmp/meds-build/meds_android_project :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-meds-tracker-android-v1
          path: /tmp/meds-build/meds_android_project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
