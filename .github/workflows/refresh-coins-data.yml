name: Refresh Coins.ph BTC OHLC Data

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-coins-data.yml"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch 1Y Coins.ph BTCPHP OHLC
        shell: bash
        run: |
          python - <<'PY'
          import json, time, urllib.parse, urllib.request
          from pathlib import Path

          BASE="https://api.pro.coins.ph/openapi/quote/v1/klines"
          SYMBOL="BTCPHP"
          now=int(time.time()*1000)
          start=now-366*24*60*60*1000
          intervals={"1h":60*60*1000,"4h":4*60*60*1000}
          Path("trading-bot/data").mkdir(parents=True,exist_ok=True)

          def fetch(interval, step_ms):
              rows=[]
              cursor=start
              chunk_bars=900
              while cursor < now:
                  end=min(cursor + chunk_bars*step_ms - 1, now)
                  qs=urllib.parse.urlencode({
                      "symbol":SYMBOL,
                      "interval":interval,
                      "startTime":cursor,
                      "endTime":end,
                      "limit":1000,
                  })
                  req=urllib.request.Request(BASE+"?"+qs, headers={"User-Agent":"Mozilla/5.0"})
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      data=json.load(resp)
                  if not isinstance(data,list):
                      raise RuntimeError(f"Unexpected response for {interval}: {data}")
                  rows.extend(data)
                  cursor=end+1
                  time.sleep(0.15)
              by_time={int(r[0]):r for r in rows if isinstance(r,list) and len(r)>=6}
              out=[by_time[k] for k in sorted(by_time)]
              if len(out)<100:
                  raise RuntimeError(f"Too few {interval} candles: {len(out)}")
              return out

          for interval,step in intervals.items():
              data=fetch(interval,step)
              path=Path(f"trading-bot/data/btcphp-{interval}.json")
              path.write_text(json.dumps(data,separators=(",",":")),encoding="utf-8")
              print(interval, len(data), "candles")
          PY

      - name: Commit refreshed data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trading-bot/data/btcphp-1h.json trading-bot/data/btcphp-4h.json
          git diff --cached --quiet && exit 0
          git commit -m "Refresh Coins.ph BTC OHLC data"
          git push
